name: Startwerte nachführen

on:
  schedule:
    # Am 3. jedes Monats, 05:23 UTC. Keine volle Stunde, damit der Lauf nicht
    # in der Stoßzeit der GitHub-Warteschlange hängt.
    - cron: "23 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nachfuehren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zahlen holen
        run: node aktualisieren.mjs

      - name: Änderung festschreiben
        run: |
          if git diff --quiet -- startwerte.json; then
            echo "Keine Änderung, nichts zu committen."
            exit 0
          fi
          git config user.name "immowolf"
          git config user.email "actions@users.noreply.github.com"
          git add startwerte.json
          git commit -m "Startwerte nachgeführt"
          git push
